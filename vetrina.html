<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Scelte di Francesco Maio | Smartphone, Tech e Casa</title>
    <meta name="description" content="Smartphone, cuffie, tech e accessori per la casa: la selezione di Francesco Maio con i migliori prodotti Amazon. Recensioni, link diretti e offerte consigliate.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://github.io">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f59e0b'/%3E%3Ctext x='50' y='68' font-size='55' font-family='Arial, sans-serif' font-weight='800' fill='%230b0f17' text-anchor='middle'%3EFM%3C/text%3E%3C/svg%3E">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f17; --bg-card: #131b28; --bg-card-hover: #182335;
            --border: #223048; --border-hover: #3b82f6; --text: #f1f5f9;
            --text-muted: #94a3b8; --accent: #f59e0b;
            --primary: #3b82f6; --primary-hover: #2563eb; --radius: 14px; --radius-sm: 8px;
            --shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; line-height: 1.5; }
        .container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 1.25rem; }
        .disclaimer-banner { background: linear-gradient(90deg, #1e293b, #0f172a); border-bottom: 1px solid var(--border); padding: 0.5rem 1rem; font-size: 0.76rem; color: var(--text-muted); text-align: center; }
        .badge-tag { background: rgba(245, 158, 11, 0.15); color: var(--accent); padding: 0.1rem 0.45rem; border-radius: 4px; font-weight: 700; font-size: 0.7rem; }
        header.site-header { background: rgba(19, 27, 40, 0.85); backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--border); padding: 1rem 0; }
        .nav-wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .logo-group { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit; }
        .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #ff9900, #f59e0b); border-radius: 10px; display: grid; place-items: center; color: #0b0f17; font-weight: 800; }
        .logo-text h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
        .logo-text p { font-size: 0.72rem; color: var(--text-muted); }
        .hero { padding: 2.5rem 0 1.5rem; text-align: center; }
        .hero-badge { display: inline-flex; background: rgba(59, 130, 246, 0.12); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.25); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.78rem; font-weight: 600; margin-bottom: 1rem; }
        .hero h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(1.8rem, 4vw, 2.7rem); font-weight: 800; letter-spacing: -0.03em; max-width: 800px; margin: 0 auto 0.75rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; margin-top: 2rem; }
        .product-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; display: flex; flex-direction: column; gap: 0.85rem; transition: var(--transition); }
        .product-card:hover { border-color: var(--border-hover); }
        .product-image-container { width: 100%; aspect-ratio: 1; background: #fff; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; padding: 0.5rem; }
        .product-image { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-category { font-size: 0.72rem; text-transform: uppercase; color: var(--primary); font-weight: 700; }
        .product-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.05rem; font-weight: 700; color: #fff; }
        .product-description { font-size: 0.82rem; color: var(--text-muted); }
        .btn-amazon { background: linear-gradient(135deg, #ff9900, #e68a00); color: #0b0f17; font-weight: 700; padding: 0.55rem 1rem; border-radius: var(--radius-sm); text-align: center; text-decoration: none; margin-top: auto; }
        footer.site-footer { background: var(--bg-card); border-top: 1px solid var(--border); padding: 2rem 0; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="disclaimer-banner">
        <span class="badge-tag">AFFILIAZIONE AMAZON</span> In qualità di Affiliato Amazon io ricevo un guadagno dagli acquisti idonei.
    </div>
    <header class="site-header">
        <div class="container nav-wrap">
            <a href="#" class="logo-group">
                <div class="logo-icon">FM</div>
                <div class="logo-text"><h1>Le Scelte di Francesco Maio</h1><p>Smartphone, Tech e Casa</p></div>
            </a>
        </div>
    </header>
    <main class="container">
        <section class="hero">
            <div class="hero-badge">✨ Nuova Selezione di Francesco Maio</div>
            <h2>I Migliori Prodotti e Offerte Consigliati per Te</h2>
        </section>
        <div class="products-grid" id="productsGrid"></div>
    </main>
    <footer class="site-footer">
        <div class="container"><p>Programma Affiliazione Amazon. © 2026</p></div>
    </footer>
    <script>
        async function caricaVetrina() {
            const grid = document.getElementById('productsGrid');
            try {
                // Legge i dati dal file prodotti.json appena creato
                const response = await fetch('prodotti.json?nocache=' + new Date().getTime());
                const prodotti = await response.json();
                
                if(!prodotti || prodotti.length === 0) {
                    grid.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">Vetrina pronta! Accedi al pannello privato per inserire il primo articolo.</p>';
                    return;
                }
                
                grid.innerHTML = prodotti.map(p => `
                    <div class="product-card">
                        <div class="product-image-container"><img src="${p.linkImmagine}" class="product-image" alt="${p.titolo}"></div>
                        <span class="product-category">${p.categoria || 'Tech'}</span>
                        <h3 class="product-title">${p.titolo}</h3>
                        <p class="product-description">${p.descrizione}</p>
                        <a href="${p.linkAmazon}" target="_blank" class="btn-amazon">Vedi su Amazon</a>
                    </div>
                `).join('');
            } catch (error) {
                grid.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">Si è verificato un errore nel caricamento dei dati.</p>';
            }
        }
        caricaVetrina();
    </script>
</body>
</html>
